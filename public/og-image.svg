<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Obsidian Background -->
  <rect width="1200" height="630" fill="#09090b" />
  
  <!-- Subtle Mesh Gradients -->
  <circle cx="150" cy="150" r="300" fill="#38BDF8" fill-opacity="0.08" filter="blur(100px)" />
  <circle cx="1050" cy="500" r="350" fill="#818CF8" fill-opacity="0.08" filter="blur(120px)" />

  <!-- Window Mockup Box -->
  <rect x="150" y="100" width="900" height="430" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="2" />
  
  <!-- Window Controls -->
  <circle cx="190" cy="140" r="6" fill="#ff5f56" />
  <circle cx="210" cy="140" r="6" fill="#ffbd2e" />
  <circle cx="230" cy="140" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text x="600" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">App.tsx — CodeMotion 2.0</text>

  <!-- Code Snippet Mockup -->
  <text x="200" y="210" fill="#c084fc" font-family="monospace" font-size="20" font-weight="bold">import</text>
  <text x="280" y="210" fill="#f8fafc" font-family="monospace" font-size="20">{ createSnippet, playMotion }</text>
  <text x="610" y="210" fill="#c084fc" font-family="monospace" font-size="20">from</text>
  <text x="670" y="210" fill="#34d399" font-family="monospace" font-size="20">'@codemotion/core'</text>

  <text x="200" y="270" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">const</text>
  <text x="270" y="270" fill="#f8fafc" font-family="monospace" font-size="20">snippet =</text>
  <text x="380" y="270" fill="#c084fc" font-family="monospace" font-size="20">await</text>
  <text x="450" y="270" fill="#facc15" font-family="monospace" font-size="20">createSnippet</text>
  <text x="600" y="270" fill="#f8fafc" font-family="monospace" font-size="20">({</text>

  <text x="230" y="320" fill="#f8fafc" font-family="monospace" font-size="20">language:</text>
  <text x="350" y="320" fill="#34d399" font-family="monospace" font-size="20">'typescript'</text>
  <text x="480" y="320" fill="#f8fafc" font-family="monospace" font-size="20">,</text>

  <text x="230" y="370" fill="#f8fafc" font-family="monospace" font-size="20">motionSpeed:</text>
  <text x="380" y="370" fill="#fb923c" font-family="monospace" font-size="20">2.0</text>
  <text x="420" y="370" fill="#f8fafc" font-family="monospace" font-size="20">,</text>

  <text x="230" y="420" fill="#f8fafc" font-family="monospace" font-size="20">pixelRatio:</text>
  <text x="370" y="420" fill="#fb923c" font-family="monospace" font-size="20">3</text>

  <text x="200" y="470" fill="#f8fafc" font-family="monospace" font-size="20">});</text>

  <!-- Watermark Badge -->
  <rect x="830" y="470" width="180" height="30" rx="15" fill="#1e293b" stroke="#475569" />
  <text x="920" y="490" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="bold">codemotion.biz.id</text>
</svg>
